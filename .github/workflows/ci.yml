name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -c constraints.txt -e ".[dev,ui]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python scripts/verify.py 0.05
      - name: Reproducibility at the stated volume (2,000 policies, 1,000 claims)
        run: python scripts/verify.py 1.0
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker build -t yottaflex-asg .
      - name: Reproducibility proof inside the container
        run: docker run --rm yottaflex-asg python scripts/verify.py 0.05
      - name: The view serves from the container
        run: |
          docker run -d --name app -p 8501:8501 yottaflex-asg
          timeout 120 bash -c 'until curl -fsS http://localhost:8501/_stcore/health; do sleep 2; done'
          curl -fsS -o /dev/null http://localhost:8501/
          docker logs app | tail -5
